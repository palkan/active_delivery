inherit_mode:
  merge:
    - Exclude

require:
  - standard

inherit_gem:
  standard: config/base.yml

inherit_from:
  - .rubocop/rspec.yml

AllCops:
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.3

Lint/DuplicateMethods:
  Exclude:
    - 'spec/**/*.rb'

Style/RedundantStructKeywordInit:
  Enabled: false
